<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V3 车队版 · 五端网络组织结构图（交互版）</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#ffffff; --ink:#1c2330; --dim:#5f6b7c;
    --blue:#185fa5; --blue-l:#e6f1fb; --teal:#0f6e56; --teal-l:#e1f5ee;
    --purple:#534ab7; --purple-l:#eeedfe; --green:#3b6d11; --green-l:#eaf3de;
    --amber:#854f0b; --amber-l:#faeeda; --line:#c9cfd8;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--ink);
       font:14px/1.7 "Microsoft YaHei","PingFang SC",sans-serif;}
  .wrap{max-width:1200px; margin:0 auto; padding:24px;}
  h1{font-size:20px; font-weight:600; margin-bottom:4px;}
  .sub{color:var(--dim); font-size:13px; margin-bottom:16px;}
  .stage{background:var(--card); border:1px solid var(--line); border-radius:12px;
         padding:12px; position:relative;}
  .svgbox{overflow-x:auto;}
  svg{min-width:920px; width:100%; height:auto; display:block;}
  .hint{font-size:12.5px; color:var(--dim); padding:8px 6px 2px;}
  .hint b{color:var(--ink);}
  /* 交互态 */
  .node{cursor:pointer;}
  .node rect.body{transition:stroke-width .12s;}
  .node.sel rect.body{stroke-width:2.5;}
  .edge{cursor:pointer;}
  .edge .hit{stroke:transparent; stroke-width:16; fill:none;}
  .edge .line{transition:stroke-width .12s;}
  .edge.sel .line{stroke-width:3.2;}
  .edge:hover .line{stroke-width:3;}
  .elabel{cursor:pointer;}
  /* 侧栏 */
  .panel{position:fixed; top:0; right:-420px; width:400px; max-width:92vw;
         height:100%; background:var(--card); border-left:1px solid var(--line);
         box-shadow:-6px 0 24px rgba(28,35,48,.10); transition:right .22s ease;
         z-index:50; display:flex; flex-direction:column;}
  .panel.open{right:0;}
  .panel .bar{padding:14px 18px 12px; border-bottom:1px solid var(--line);
              display:flex; align-items:flex-start; gap:10px;}
  .panel .bar .t{flex:1;}
  .panel .bar .k{font-size:11.5px; padding:1px 8px; border-radius:9px; display:inline-block; margin-bottom:4px;}
  .panel .bar h3{font-size:15.5px; font-weight:600; line-height:1.4;}
  .panel .x{cursor:pointer; border:none; background:#eef1f5; color:var(--dim);
            width:28px; height:28px; border-radius:8px; font-size:15px; line-height:1;}
  .panel .bd{padding:14px 18px 24px; overflow-y:auto; flex:1; font-size:13.5px;}
  .panel h4{font-size:13px; font-weight:600; margin:14px 0 6px; color:var(--dim);}
  .panel h4:first-child{margin-top:0;}
  .panel table{width:100%; border-collapse:collapse; font-size:12.5px; margin:6px 0;}
  .panel th,.panel td{border:1px solid var(--line); padding:5px 8px; text-align:left; vertical-align:top;}
  .panel th{background:#eef1f5; white-space:nowrap;}
  .panel code{font-family:Consolas,monospace; font-size:12px; background:#eef1f5;
              padding:1px 5px; border-radius:4px; word-break:break-all;}
  .panel pre{background:#101722; color:#d7e2ee; font:12px/1.6 Consolas,monospace;
             padding:10px 12px; border-radius:8px; overflow-x:auto; margin:6px 0;}
  .panel pre i{color:#e8b26a; font-style:normal;}
  .panel pre b{color:#7fd0a8; font-weight:400;}
  .panel p{margin-bottom:8px;}
  .panel ul{padding-left:18px; margin-bottom:8px;}
  .panel li{margin-bottom:4px;}
  .mask{display:none;}
  @media (max-width:760px){
    .mask{display:block; position:fixed; inset:0; background:rgba(28,35,48,.35);
          z-index:40; opacity:0; pointer-events:none; transition:opacity .2s;}
    .mask.on{opacity:1; pointer-events:auto;}
  }
</style>
</head>
<body>
<div class="wrap">

      <!-- ================= 节点（上层，后画盖住线头） ================= -->
      <!-- 云端 -->
      <g class="node" data-node="cloud">

        <text x="500" y="62" text-anchor="middle" font-size="15" font-weight="600" fill="#26215c">华为云 IoTDA（云端）</text>
        <text x="500" y="84" text-anchor="middle" font-size="11.5" fill="#534ab7">cn-north-4 · 实例 fa2da76a-…</text>
        <text x="500" y="102" text-anchor="middle" font-size="11.5" fill="#534ab7">MQTT 接入 · 设备影子 · 命令队列</text>
        <text x="500" y="126" text-anchor="middle" font-size="10.5" fill="#8f88d6">点击查看详情</text>
      </g>

      <!-- APP端 -->
      <g class="node" data-node="app">
        <rect class="body" x="60" y="330" width="202" height="122" rx="14"
              fill="#e6f1fb" stroke="#185fa5" stroke-width="1.4"/>
        <text x="161" y="360" text-anchor="middle" font-size="15" font-weight="600" fill="#042c53">APP 端</text>
        <text x="161" y="382" text-anchor="middle" font-size="11.5" fill="#185fa5">CarFleet（HarmonyOS ArkTS）</text>
        <text x="161" y="400" text-anchor="middle" font-size="11.5" fill="#185fa5">车队 · 操控 · 内嵌管理后台</text>
        <text x="161" y="432" text-anchor="middle" font-size="10.5" fill="#5b93c4">点击查看详情</text>
      </g>

      <!-- 后端服务 -->
      <g class="node" data-node="backend">
        <rect class="body" x="378" y="330" width="244" height="144" rx="14"
              fill="#e1f5ee" stroke="#0f6e56" stroke-width="1.4"/>
        <text x="500" y="360" text-anchor="middle" font-size="15" font-weight="600" fill="#04342c">后端服务</text>
        <text x="500" y="382" text-anchor="middle" font-size="11.5" fill="#0f6e56">app.py（Flask :8000）</text>
        <text x="500" y="400" text-anchor="middle" font-size="11.5" fill="#0f6e56">REST 22 端点 · WS /ws</text>
        <text x="500" y="418" text-anchor="middle" font-size="11.5" fill="#0f6e56">STATE_CACHE · 轨迹库 · admin</text>
        <text x="500" y="452" text-anchor="middle" font-size="10.5" fill="#5dcaa5">点击查看详情</text>

      <!-- 模拟小车端 -->
      <g class="node" data-node="sim">
        <rect class="body" x="738" y="330" width="224" height="144" rx="14"
              fill="#eaf3de" stroke="#3b6d11" stroke-width="1.4"/>
        <text x="850" y="360" text-anchor="middle" font-size="15" font-weight="600" fill="#173404">模拟小车端</text>
        <text x="850" y="382" text-anchor="middle" font-size="11.5" fill="#3b6d11">car_mqtt_client.py × N 进程</text>
        <text x="850" y="400" text-anchor="middle" font-size="11.5" fill="#3b6d11">CarSim 20Hz 运动模型</text>
        <text x="850" y="418" text-anchor="middle" font-size="11.5" fill="#3b6d11">5s / 60s / 事件 补报</text>
        <text x="850" y="452" text-anchor="middle" font-size="10.5" fill="#97c459">点击查看详情</text>
      </g>

      <!-- 轨迹回放视图端 -->
      <g class="node" data-node="replay">
        <rect class="body" x="60" y="560" width="202" height="122" rx="14"

        <text x="161" y="590" text-anchor="middle" font-size="15" font-weight="600" fill="#412402">轨迹回放视图端</text>
        <text x="161" y="612" text-anchor="middle" font-size="11.5" fill="#854f0b">track_demo.html / APP 轨迹页</text>

    </div>
    <div class="hint"><b>使用说明</b>：点击任意节点查看该端的详细介绍；点击任意连线查看两端之间的接口调用与数据传输明细（协议、方向、报文示例、节奏）。</div>
  </div>
</div>

<!-- 侧栏 -->

<aside class="panel" id="panel">
  <div class="bar">
    <div class="t"><span class="k" id="pKind">节点</span><h3 id="pTitle">标题</h3></div>
    <button class="x" id="pClose" title="关闭">✕</button>
  </div>
  <div class="bd" id="pBody"></div>
</aside>

<script>
(function(){
  var THEME = {
    app:    {label:"APP 端",           color:"#185fa5", bg:"#e6f1fb"},
    backend:{label:"后端服务",         color:"#0f6e56", bg:"#e1f5ee"},
    cloud:  {label:"华为云 IoTDA",     color:"#534ab7", bg:"#eeedfe"},
    sim:    {label:"模拟小车端",       color:"#3b6d11", bg:"#eaf3de"},
    replay: {label:"轨迹回放视图端",   color:"#854f0b", bg:"#faeeda"},
    e1:     {label:"接口连线",         color:"#185fa5", bg:"#e6f1fb"},
    e2:     {label:"接口连线",         color:"#0f6e56", bg:"#e1f5ee"},
    e3:     {label:"接口连线",         color:"#534ab7", bg:"#eeedfe"},
    e4:     {label:"接口连线",         color:"#3b6d11", bg:"#eaf3de"},
    e5:     {label:"接口连线",         color:"#854f0b", bg:"#faeeda"}
  };

  var NODES = {
    app: `
      <h4>定位</h4>
      <p><b>操作者</b>。跑在 HarmonyOS 手机/平板上的鸿蒙原生应用，负责看车队、开车、查轨迹、管设备。</p>
      <h4>工程信息</h4>
      <table>
        <tr><th>路径</th><td><code>E:\\Harmony\\Project\\CarFleet</code></td></tr>
        <tr><th>包名</th><td><code>com.example.carfleet</code></td></tr>
        <tr><th>技术栈</th><td>ArkTS + Canvas + Web 组件 + Preferences</td></tr>
        <tr><th>网络层</th><td><code>FleetClient.ets</code></td></tr>
      </table>
      <h4>四个视图</h4>
      <ul>
        <li><b>车队页</b>：摘要卡 + 车辆卡片列表，点卡片选中车辆；右上角进入管理后台</li>
        <li><b>操控页</b>：300vp 实时地图（全部车、点选切换）+ 摇杆（松手保持、拖回中心停、双击急停）+ 状态三格</li>
        <li><b>轨迹回放页</b>：Canvas 画历史轨迹、4 档时间窗、点数/里程统计</li>
        <li><b>管理后台页</b>：Web 组件内嵌电脑版 <code>/admin/view</code>，功能与 PC 完全一致</li>
      </ul>
      <h4>网络行为</h4>
      <table>
        <tr><th>动作</th><th>接口</th><th>节奏</th></tr>
        <tr><td>轮询车队状态</td><td><code>GET /fleet/status</code></td><td>每 800ms</td></tr>
        <tr><td>控车</td><td><code>POST /command</code></td><td>摇杆拖动时</td></tr>
        <tr><td>查轨迹</td><td><code>GET /track</code></td><td>进入轨迹页</td></tr>
        <tr><td>管理后台</td><td>Web 组件加载 <code>/admin/view</code></td><td>进入页面时</td></tr>
      </table>
      <h4>注意事项</h4>
      <ul>
        <li>手机与 PC 必须同一 WiFi，连接地址填 PC 内网 IP</li>
        <li>ArkTS 代码改动需要 DevEco 重新构建运行才生效</li>
        <li>轨迹时间字段解析：<code>Date.parse(t.replace(' ','T'))</code></li>
        <li>Web 组件不弹原生 confirm/alert（后台页面已改自绘弹窗规避）</li>
      </ul>`,

    backend: `
      <h4>定位</h4>
      <p><b>全系统的唯一数据枢纽</b>。所有客户端只认它，所有云端访问只经它——它的 STATE_CACHE 是全系统唯一状态源。</p>
      <h4>基本信息</h4>
      <table>
        <tr><th>文件</th><td><code>server/app.py</code>（Flask）+ <code>track_store.py</code></td></tr>
        <tr><th>端口</th><td><code>:8000</code>（HTTP + WebSocket）</td></tr>
        <tr><th>启动</th><td><code>python server/app.py</code></td></tr>
        <tr><th>配套文件</th><td><code>devices.json</code> 花名册 · <code>cloud_config.json</code> AK/SK · <code>fleet_track.db</code> 轨迹库 · <code>commands.log</code> 审计</td></tr>
      </table>
      <h4>内部模块</h4>
      <ul>
        <li><b>poll_loop 轮询线程</b>：每 2s 调云端 SDK 抄"在线状态 + 影子"写入 STATE_CACHE</li>
        <li><b>乐观回显 + 守卫</b>：命令受理即预填预期朝向/速度并立即推 WS（命令→画面 ≈0.33s）；守卫防止 4s 内旧影子覆盖回显</li>
        <li><b>REST API</b>：22 个端点（查询/控制/轨迹/管理）</li>
        <li><b>WebSocket /ws</b>：fleet_state 帧，事件驱动 + 0.5s 兜底</li>
        <li><b>轨迹库</b>：SQLite WAL，真实观测且变化才插行，7 天过期 + 2 万条上限</li>
        <li><b>admin 模块</b>：唯一能反向操作基础设施的部分（注册/删除/冻结/上下线/对账）</li>
      </ul>
      <h4>设计要点</h4>
      <ul>
        <li>客户端永远不直连云端，保证换云厂商只改本层 SDK 封装</li>
        <li>乐观回显的预测值<b>绝不写入</b>轨迹库（历史数据保真）</li>
        <li>admin token 是内存态，后端重启需重新登录</li>
      </ul>`,

    cloud: `
      <h4>定位</h4>
      <p><b>哑巴信箱</b>：只做接入、存储、转发，不理解数据含义、不存历史、不做业务判断。所有"智能"都在后端。</p>
      <h4>基本信息</h4>
      <table>
        <tr><th>服务</th><td>华为云 IoTDA（设备接入）</td></tr>
        <tr><th>区域/实例</th><td>cn-north-4 · fa2da76a-3272-4114-a5dc-91b1e212b957（标准版）</td></tr>
        <tr><th>配额</th><td>免费单元约 <b>1 万条消息/日</b>（上报节奏 5s/60s 即为此定）</td></tr>
      </table>
      <h4>三大能力</h4>
      <table>
        <tr><th>能力</th><th>说明</th></tr>
        <tr><td>MQTT 接入</td><td>:8883 TLS，设备三元组认证，只管"连没连上"</td></tr>
        <tr><td>设备影子</td><td>每设备存<b>最后一次</b> car_status 上报快照，车离线也可读</td></tr>
        <tr><td>命令队列</td><td>投递 car_control 命令给在线设备，返回 command_id（受理回执）</td></tr>
      </table>
      <h4>SDK 调用（后端使用）</h4>
      <p><code>ShowDevice</code>（查在线）· <code>ShowDeviceShadow</code>（读影子）· <code>CreateCommand</code>（下发）· <code>AddDevice/DeleteDevice</code>（注册/注销）· <code>ListDevices</code>（对账）</p>
      <h4>已知坑</h4>
      <ul>
        <li>ListDevices 过滤参数不生效 → 查状态必须逐台 ShowDevice；limit 上限 50</li>
        <li>影子数值是 Decimal；命令体类是 DeviceCommandRequest（与文档不同）</li>
        <li>注册前云端可能残留同名设备 → 先 DeleteDevice</li>
      </ul>`,

    sim: `
      <h4>定位</h4>
      <p><b>真正"会动的东西"</b>。每台车一个独立 Python 进程，与将来真车遵守完全相同的 MQTT 协议——换真车时本层整体替换，上层零改动。</p>
      <h4>基本信息</h4>
      <table>
        <tr><th>文件</th><td><code>device/car_mqtt_client.py</code></td></tr>
        <tr><th>启动</th><td><code>python device/car_mqtt_client.py --device car_00N</code></td></tr>
        <tr><th>身份来源</th><td>从 <code>server/devices.json</code> 读云 ID/密钥/出生点/调试端口</td></tr>
        <tr><th>调试口</th><td>8081~8085 各车独占，<code>GET /state</code> 吐 20Hz 内存实时状态（仅调试）</td></tr>
      </table>
      <h4>内部结构</h4>
      <ul>
