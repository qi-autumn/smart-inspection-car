<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V3 管理后台（第⑤步）</title>
<style>
  :root{
    --bg:#0d1420; --panel:#151f30; --panel2:#1b2740; --line:#2a3a55;
    --text:#dfe7f2; --dim:#8fa3bf; --accent:#37c2a0; --warn:#e2b13c; --bad:#e25b5b;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--text);
       font-family:"Microsoft YaHei",system-ui,sans-serif; padding:14px 18px;}
  h1{font-size:19px; font-weight:600; margin-bottom:12px;}
  h2{font-size:13px; color:var(--dim); font-weight:600; margin-bottom:8px;}
  a{color:var(--accent); text-decoration:none; font-size:13px;}
  button{cursor:pointer; border:1px solid var(--line); background:var(--panel2);
         color:var(--text); border-radius:6px; padding:6px 14px; font-size:13px;}
  button:hover{border-color:var(--accent);}
  button.warn{border-color:#a08040; color:var(--warn);}
  button.danger{background:#5b2020; border-color:#a04040;}
  input,select{background:var(--panel2); border:1px solid var(--line); color:var(--text);
         border-radius:6px; padding:7px 10px; font-size:13px; outline:none;}
  input:focus{border-color:var(--accent);}
  table{width:100%; border-collapse:collapse; font-size:13px;}
  th,td{padding:8px 10px; text-align:left; border-bottom:1px solid var(--line);}
  th{color:var(--dim); font-weight:600; font-size:12px;}
  .dot{display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:5px;}
  .tag{font-size:11px; padding:2px 8px; border-radius:9px; border:1px solid var(--line);}
  .tag.frozen{color:var(--bad); border-color:var(--bad);}
  .tag.ok{color:var(--accent); border-color:var(--accent);}
  .tag.off{color:var(--dim);}

  /* 登录 */
  #login{max-width:340px; margin:12vh auto; background:var(--panel);
         border:1px solid var(--line); border-radius:12px; padding:26px;}
  #login h1{font-size:17px;}
  #login input{width:100%; margin-bottom:12px;}
  #login button{width:100%; padding:10px;}
  #loginMsg{color:var(--bad); font-size:12px; min-height:16px; margin-bottom:8px;}
  .hint{color:var(--dim); font-size:12px; margin-top:10px;}

  /* 主界面 */
  #main{display:none;}
  header{display:flex; align-items:center; gap:14px; margin-bottom:12px; flex-wrap:wrap;}
  header .spacer{flex:1;}
  .tabs{display:flex; gap:8px; margin-bottom:14px;}
  .tabs button{padding:8px 20px;}
  .tabs button.act{border-color:var(--accent); color:var(--accent);}
  .panel{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:14px;}
  .stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; margin-bottom:14px;}
  .stat{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px;}
  .stat b{font-size:24px; display:block;}
  .stat span{font-size:12px; color:var(--dim);}
  .row{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:10px;}
  .view{display:none;} .view.act{display:block;}
  #regMsg{font-size:12px; min-height:16px; margin:8px 0;}
  #regMsg.good{color:var(--accent);} #regMsg.bad{color:var(--bad);}
  #secret{background:#0f1a2c; border:1px dashed var(--accent); border-radius:8px;
          padding:10px; margin-top:8px; display:none; font-size:13px; line-height:1.8;}
  /* 设备卡片（手机窄屏友好：信息一行、操作第二行） */
  .devcard{background:var(--panel); border:1px solid var(--line); border-radius:10px;
           padding:10px 12px; margin-bottom:10px;}
  .devrow1{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .devname{font-weight:600; font-size:14px;}
  .devid{color:var(--dim); font-size:11px; word-break:break-all;}
  .devmeta{color:var(--dim); font-size:12px; margin-top:5px;}
  .devops{display:flex; gap:8px; margin-top:9px;}
  .devops button{flex:1; padding:7px 0; font-size:12px;}

  /* 自绘确认弹窗（APP 的 Web 组件不弹原生 confirm，必须用页面内弹窗） */
  #modalMask{display:none; position:fixed; inset:0; background:rgba(0,0,0,.55);
             z-index:99; align-items:center; justify-content:center; padding:24px;}
  #modalBox{background:var(--panel); border:1px solid var(--line); border-radius:12px;
            padding:18px; max-width:340px; width:100%;}
  #modalText{font-size:13px; line-height:1.7; white-space:pre-line; margin-bottom:14px;}
  .modalBtns{display:flex; gap:10px;}
  .modalBtns button{flex:1; padding:9px 0;}
  .modalBtns .danger{background:#5b2020; border-color:#a04040;}
</style>
</head>
<body>

<!-- 自绘确认弹窗（替代原生 confirm，兼容 APP Web 组件） -->
<div id="modalMask">
  <div id="modalBox">
    <div id="modalText"></div>
    <div class="modalBtns">
      <button id="modalCancel">取 消</button>
      <button id="modalOk" class="danger">确认删除</button>
    </div>
  </div>
</div>

<!-- 登录 -->
<div id="login">
  <h1>V3 车队管理后台</h1>
  <div style="height:10px"></div>
  <div id="loginMsg"></div>
  <input id="u" placeholder="用户名" value="admin">
  <input id="p" type="password" placeholder="密码" value="">
  <button onclick="doLogin()">登 录</button>
  <div class="hint">演示账号：admin / admin123</div>
</div>

<!-- 主界面 -->
<div id="main">
  <header>
    <h1>V3 车队管理后台</h1>
    <span class="spacer"></span>
    <a href="/monitor/view" target="_blank">监控大屏 ↗</a>
    <a href="/track/view" target="_blank">轨迹回放 ↗</a>
    <a href="/ai/view" target="_blank">AI 语音控车 ↗</a>
    <button onclick="doLogout()">退出</button>
  </header>
  <div class="tabs">
    <button class="act" data-tab="ov">车队总览</button>
    <button data-tab="dev">设备管理</button>
    <button data-tab="cmd">命令历史</button>
  </div>

  <!-- 总览 -->
  <div class="view act" id="ov">
    <div class="stats" id="stats"></div>
    <div class="panel">
      <h2>车辆实时状态（每 3 秒刷新）</h2>
      <table><thead><tr>
        <th>车辆</th><th>状态</th><th>位置</th><th>速度</th><th>电量</th><th>冻结</th>
      </tr></thead><tbody id="ovBody"></tbody></table>
    </div>
  </div>

  <!-- 设备管理 -->
  <div class="view" id="dev">
    <div class="panel">
      <h2>动态注册新车（云端 IoTDA + 本地注册表一次完成）</h2>
      <div class="row">
        <input id="regNode" placeholder="node_id，如 car_003" style="width:200px">
        <input id="regName" placeholder="名称（默认：巡检车car_003）" style="width:220px">
        <button onclick="registerDevice()">注 册</button>
      </div>
      <div id="regMsg"></div>
      <div id="secret"></div>
    </div>
    <div class="panel">
      <h2>已注册设备（上线=启动本机模拟器；删除会同时注销云端设备）</h2>
      <div id="devBody"></div>
    </div>
    <div class="panel">
      <h2>云端对账（IoTDA 实际注册 vs 本地注册表，手动刷新）</h2>
      <div class="row">
        <button onclick="loadCloud()">对账刷新</button>
        <span id="cloudMsg" style="font-size:12px;color:var(--dim)"></span>
      </div>
      <div id="cloudBody"></div>
    </div>
  </div>

  <!-- 命令历史 -->
  <div class="view" id="cmd">
    <div class="panel">
      <div class="row">
        <h2 style="margin:0">命令历史（commands.log，最新在前）</h2>
        <span class="spacer" style="flex:1"></span>
        <select id="cmdFilter" onchange="loadCommands()"><option value="">全部设备</option></select>
        <button onclick="loadCommands()">刷新</button>
      </div>
      <table><thead><tr>
        <th>时间</th><th>设备</th><th>动作</th><th>参数</th><th>结果</th>
      </tr></thead><tbody id="cmdBody"></tbody></table>
    </div>
  </div>
</div>

<script>
"use strict";
const $ = s => document.querySelector(s);
let TOKEN = localStorage.getItem("v3_admin_token") || "";

const H = {"Content-Type": "application/json"};
function hdr() { return {...H, "X-Auth-Token": TOKEN}; }

async function api(path, opts = {}) {
  const r = await fetch(path, {headers: hdr(), ...opts});
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { showLogin("登录已失效，请重新登录"); throw new Error("401"); }
  return {code: r.status, j};
}

/* ---------------- 登录 ---------------- */
function showLogin(msg) {
  TOKEN = ""; localStorage.removeItem("v3_admin_token");
  $("#login").style.display = "block"; $("#main").style.display = "none";
  $("#loginMsg").textContent = msg || "";
}
async function doLogin() {
  const r = await fetch("/admin/login", {method: "POST", headers: H,
    body: JSON.stringify({username: $("#u").value, password: $("#p").value})});
  const j = await r.json();
  if (!r.ok || !j.ok) { $("#loginMsg").textContent = j.error || "登录失败"; return; }
  TOKEN = j.token; localStorage.setItem("v3_admin_token", TOKEN);
  $("#login").style.display = "none"; $("#main").style.display = "block";
  refreshAll();
}
function doLogout() { showLogin(""); }
if (TOKEN) { $("#login").style.display = "none"; $("#main").style.display = "block"; refreshAll(); }
$("#p").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });

/* ---------------- 页签 ---------------- */
document.querySelectorAll(".tabs button").forEach(b => {
  b.onclick = () => {
    document.querySelectorAll(".tabs button").forEach(x => x.classList.remove("act"));
    document.querySelectorAll(".view").forEach(x => x.classList.remove("act"));
    b.classList.add("act"); $("#" + b.dataset.tab).classList.add("act");
  };
});

/* ---------------- 总览 ---------------- */
async function loadOverview() {
  const {code, j} = await api("/admin/overview");
  if (code !== 200 || !j.ok) return;
  const cards = [
    ["车队总数", j.total], ["在线", j.online], ["冻结", j.frozen],
    ["平均电量", (j.avg_battery ?? "–") + "%"],
    ["轨迹点", j.track_points], ["命令累计", j.commands_total]];
  $("#stats").innerHTML = cards.map(([k, v]) =>
    `<div class="stat"><b>${v}</b><span>${k}</span></div>`).join("");
  $("#ovBody").innerHTML = j.cars.map(c => `<tr>
    <td><span class="dot" style="background:${c.color}"></span>${c.name}</td>
    <td>${c.online ? '<span class="tag ok">● 在线</span>' : '<span class="tag off">○ 离线</span>'}</td>
    <td>${fmt(c.x)}, ${fmt(c.y)}</td><td>${fmt(c.speed)}%</td><td>${fmt(c.battery)}%</td>
    <td>${c.frozen ? '<span class="tag frozen">已冻结</span>' : '<span class="tag ok">正常</span>'}</td>
  </tr>`).join("");
}
const fmt = v => (v === null || v === undefined) ? "–" : (typeof v === "number" ? v.toFixed(1) : v);

/* ---------------- 设备管理 ---------------- */
async function loadDevices() {
  const {code, j} = await api("/admin/devices");
  if (code !== 200 || !j.ok) return;
  $("#devBody").innerHTML = j.devices.map(d => `<div class="devcard">
    <div class="devrow1">
      <span class="dot" style="background:${d.color}"></span>
      <span class="devname">${d.name}</span>
      ${d.online ? '<span class="tag ok">● 在线</span>' : '<span class="tag off">○ 离线</span>'}
      ${d.frozen ? '<span class="tag frozen">已冻结</span>' : '<span class="tag ok">正常</span>'}
    </div>
    <div class="devid">${d.device_id}</div>
    <div class="devmeta">电量 ${fmt(d.battery)}%　·　位置 ${fmt(d.x)}, ${fmt(d.y)}</div>
    <div class="devops">
      ${d.online
        ? `<button onclick="stopSim('${d.device_id}')">下线</button>`
        : `<button onclick="startSim('${d.device_id}')">上线</button>`}
      <button class="${d.frozen ? "" : "warn"}"
        onclick="toggleFreeze('${d.device_id}', ${!d.frozen})">
        ${d.frozen ? "解冻" : "冻结"}</button>
      <button class="danger" onclick="deleteDevice('${d.device_id}')">删除</button>
    </div>
  </div>`).join("");
}
async function startSim(did) {
  const {code, j} = await api(`/admin/devices/${encodeURIComponent(did)}/start`, {method: "POST"});
  if (code === 200 && j.ok) {
    setTimeout(() => { loadDevices(); loadOverview(); }, 4000);  // 等 MQTT 建连
  } else showModalMsg("启动失败: " + (j.error || code));
}
async function stopSim(did) {
  const {code, j} = await api(`/admin/devices/${encodeURIComponent(did)}/stop`, {method: "POST"});
  if (code === 200 && j.ok) setTimeout(() => { loadDevices(); loadOverview(); }, 4500);
  else showModalMsg("停止失败: " + (j.error || code));
}
async function deleteDevice(did) {
  askConfirm(`确定删除 ${did}？\n云端 IoTDA 设备与本地注册表将一并注销，不可恢复！`, async (yes) => {
    if (!yes) return;
    const {code, j} = await api(`/admin/devices/${encodeURIComponent(did)}`,
      {method: "DELETE", body: JSON.stringify({confirm: true})});
    if (code === 200 && j.ok) { loadDevices(); loadOverview(); }
    else showModalMsg("删除失败: " + (j.error || code));
  });
}

/* ---------------- 自绘确认弹窗 ---------------- */
let _modalCb = null;
function askConfirm(text, cb) {
  $("#modalText").textContent = text;
  $("#modalOk").textContent = "确认删除";
  $("#modalMask").style.display = "flex";
  _modalCb = cb;
}
function showModalMsg(text) {
  $("#modalText").textContent = text;
  $("#modalOk").textContent = "知道了";
  $("#modalMask").style.display = "flex";
  _modalCb = null;   // 仅提示，点"知道了"直接关闭
}
$("#modalOk").onclick = () => { $("#modalMask").style.display = "none"; const cb = _modalCb; _modalCb = null; if (cb) cb(true); };
$("#modalCancel").onclick = () => { $("#modalMask").style.display = "none"; const cb = _modalCb; _modalCb = null; if (cb) cb(false); };

/* ---------------- 云端对账 ---------------- */
const STATUS_TXT = {ONLINE: "在线", OFFLINE: "离线", INACTIVE: "未激活", UNKNOWN: "未知"};
async function loadCloud() {
  const msg = $("#cloudMsg");
  msg.textContent = "对账中…"; msg.style.color = "var(--dim)";
  const {code, j} = await api("/admin/cloud/devices");
  if (code !== 200 || !j.ok) {
    msg.textContent = "✘ " + (j.error || code); msg.style.color = "var(--bad)"; return;
  }
  const residue = j.cloud.filter(c => !c.in_registry).length;
  const localOnly = (j.local_only || []).length;
  msg.textContent = `云端 ${j.cloud.length} 台 / 本地 ${(j.cloud.filter(c=>c.in_registry).length + localOnly)} 台` +
    (residue ? `，⚠ 云端残留 ${residue} 台` : "") +
    (localOnly ? `，⚠ 本地多出 ${localOnly} 台（${j.local_only.join("、")}）` : "");
  msg.style.color = (residue || localOnly) ? "var(--warn)" : "var(--accent)";
  $("#cloudBody").innerHTML = j.cloud.map(c => {
    const resid = !c.in_registry;
    return `<div class="devcard">
      <div class="devrow1">
        <span class="devname">${c.name || "-"}</span>
        <span class="tag ${c.status === "ONLINE" ? "ok" : "off"}">${STATUS_TXT[c.status] || c.status}</span>
        ${resid ? '<span class="tag frozen">云端残留</span>' : '<span class="tag ok">两边一致</span>'}
      </div>
      <div class="devid">${c.device_id}</div>
      ${resid ? `<div class="devops"><button class="danger" onclick="deleteCloudOnly('${c.device_id}')">删除残留</button></div>` : ""}
    </div>`;
  }).join("") || '<div style="color:var(--dim);font-size:13px">云端无本产品设备</div>';
}
async function deleteCloudOnly(did) {
  askConfirm(`确定删除云端残留设备 ${did}？不可恢复！`, async (yes) => {
    if (!yes) return;
    const {code, j} = await api(`/admin/cloud/${encodeURIComponent(did)}`, {method: "DELETE"});
    if (code === 200 && j.ok) loadCloud();
    else showModalMsg("删除失败: " + (j.error || code));
  });
}
async function toggleFreeze(did, frozen) {
  const {code, j} = await api(`/admin/devices/${encodeURIComponent(did)}/freeze`,
    {method: "POST", body: JSON.stringify({frozen})});
  if (code === 200 && j.ok) loadDevices();
}

async function registerDevice() {
  const msg = $("#regMsg"), sec = $("#secret");
  msg.className = ""; msg.textContent = "注册中…"; sec.style.display = "none";
  try {
    const {code, j} = await api("/admin/devices", {method: "POST", body: JSON.stringify({
      node_id: $("#regNode").value.trim(), name: $("#regName").value.trim()})});
    if (code !== 200 || !j.ok) { msg.className = "bad"; msg.textContent = "✘ " + (j.error || code); return; }
    msg.className = "good";
    msg.textContent = `✔ 注册成功：${j.name}（${j.device_id}），渲染色 ${j.color}`;
    sec.style.display = "block";
    sec.innerHTML = `MQTT 密钥（仅显示一次，请保存）：<b>${j.secret}</b><br>
      启动模拟器：<code>python device/car_mqtt_client.py --device ${$("#regNode").value.trim()}</code>`;
    loadDevices();
  } catch (e) { msg.className = "bad"; msg.textContent = "✘ " + e; }
}

/* ---------------- 命令历史 ---------------- */
let filterFilled = false;
async function loadCommands() {
  const {code, j} = await api("/admin/commands?limit=200");
  if (code !== 200 || !j.ok) return;
  const ids = [...new Set(j.records.map(r => r.device_id))];
  if (!filterFilled) {
    $("#cmdFilter").innerHTML = '<option value="">全部设备</option>' +
      ids.map(i => `<option>${i}</option>`).join("");
    filterFilled = true;
  }
  const f = $("#cmdFilter").value;
  const rows = j.records.filter(r => !f || r.device_id === f);
  $("#cmdBody").innerHTML = rows.map(r => {
    const bad = r.result && !r.result.startsWith("ok");
    return `<tr>
      <td>${r.time}</td><td>${short(r.device_id)}</td><td>${r.action}</td>
      <td style="max-width:260px;word-break:break-all;color:var(--dim)">${esc(JSON.stringify(r.detail))}</td>
      <td style="color:${bad ? "var(--bad)" : "var(--accent)"}">${esc(r.result)}</td>
    </tr>`;
  }).join("") || '<tr><td colspan="5" style="color:var(--dim)">暂无记录</td></tr>';
}
const short = d => d === "system" ? "系统" : d.split("_").slice(-1)[0] ? d.slice(-7) : d;
const esc = s => (s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;");

function refreshAll() { loadOverview(); loadDevices(); loadCommands(); loadCloud(); }
setInterval(() => { if (TOKEN && $("#main").style.display !== "none") { loadOverview(); loadDevices(); } }, 3000);
</script>
</body>
</html>
